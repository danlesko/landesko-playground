name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Don't burn minutes on superseded pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here needs to write to the repo.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Must run before setup-node so that `cache: pnpm` can find the binary.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        # 22.x matches the Node version pinned on the Vercel project.
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      # pnpm 10 does not run dependency build scripts by default, so the
      # "Ignored build scripts" warning for sharp/@vercel/speed-insights/etc.
      # is expected.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # The suite mocks the database and auth and never opens a socket, so it
      # needs no secrets. Runs before the build because it is far faster.
      - name: Test
        run: pnpm test

      # `next build` needs no environment variables.
      - name: Build
        run: pnpm build

  # Deliberately a second job rather than more steps on `verify`.
  #
  # The two answer different questions and should be able to fail independently:
  # a Chromium download hiccup or a browser timeout must not bury the lint and
  # typecheck result, and a formatting failure must not stop us learning whether
  # the app still renders. Split, the PR shows which axis broke. They also run
  # concurrently, so the browser install does not extend the critical path.
  #
  # The cost is an honest one: `pnpm build` runs in both jobs. Passing `.next`
  # between them as an artifact would remove that, at the price of making this
  # job wait for `verify` and fail whenever `verify` fails -- which is exactly
  # the independence the split is for. At this repo's size the second build is
  # the cheaper half of that trade.
  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A downloaded browser is only valid for the Playwright version that
      # fetched it, and the lockfile is what pins that version.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Only chromium: the suite declares a single project, so fetching firefox
      # and webkit would triple the download for browsers nothing runs on.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # `build:e2e`, not `build`. `NEXT_PUBLIC_*` values are inlined into the client
      # bundle at build time, so a runner that had a real reCAPTCHA site key would compile
      # it in and the /contact tests would exercise a different page from the one they
      # describe -- four of them fail, measured. Nothing sets those here today; this is
      # what keeps that true if someone adds them.
      - name: Build
        run: pnpm build:e2e

      # `api.localtest.me` is a public DNS record pointing at 127.0.0.1, which is
      # what makes the stack zero-config locally. Pinned here anyway so a lapse in
      # somebody else's DNS cannot turn into a red pipeline, and so the run does not
      # depend on network resolution it does not need.
      #
      # This name, not the one in POSTGRES_URL: `@neondatabase/serverless` rewrites a
      # pooled host to `api.<domain>` before fetching. See e2e/db/compose.yaml.
      - name: Point api.localtest.me at localhost
        run: echo "127.0.0.1 api.localtest.me" | sudo tee -a /etc/hosts

      # `docker compose`, not Actions `services:`, and NOT because services cannot
      # express the topology -- an earlier version of this comment claimed that and it
      # is false. Service containers in a job do share a network and can address each
      # other by label.
      #
      # The reasons are parity and setup: this is the same file a contributor runs
      # locally, so CI cannot drift from it, and the stack needs a mounted init script
      # plus Caddy's root CA extracted afterwards. `services:` gives nowhere to put
      # either.
      - name: Start the e2e database
        run: pnpm e2e:db:up

      # No `env:` for auth here on purpose. The placeholder AUTH_SECRET lives in
      # playwright.config.ts so that a local run and a CI run exercise the same
      # auth path -- see the comment there.
      #
      # E2E_DATABASE=1 is what un-skips the /blog tests. Without it they skip with a
      # reason, which is what a contributor without Docker gets.
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          E2E_DATABASE: "1"

      # A SECOND pass, with the database deliberately not offered.
      #
      # Giving CI a database silently disabled the two error-boundary tests from
      # #154, because they only run when a read FAILS -- with a working database
      # there is no boundary to attribute, so they skip, and CI would have lost
      # coverage it had yesterday. They are cheap and they are the only thing
      # asserting that a failed read reaches blog/error.tsx rather than the root
      # boundary, so they get their own run instead.
      #
      # Narrowed with --grep rather than running the whole suite twice: everything
      # else is already covered by the pass above, and the point is these two.
      - name: End-to-end tests without a database
        run: pnpm test:e2e --grep "renders the blog boundary"
        env:
          # Explicitly empty rather than merely unset. Playwright forwards the
          # ambient environment to the web server, so a caller with POSTGRES_URL
          # exported would hand this pass a working database and turn its two tests
          # into skips -- which is exactly the silent hole this pass exists to close.
          POSTGRES_URL: ""

      # Runs even on failure: when a /blog test fails, whether the database came up
      # correctly is the first question, and the answer is only in these logs.
      - name: Database logs
        if: ${{ failure() }}
        run: docker compose -f e2e/db/compose.yaml logs --no-color

      - name: Stop the e2e database
        if: ${{ always() }}
        run: pnpm e2e:db:down

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
