name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Don't burn minutes on superseded pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here needs to write to the repo.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must run before setup-node so that `cache: pnpm` can find the binary.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        # 22.x matches the Node version pinned on the Vercel project.
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      # pnpm 10 does not run dependency build scripts by default, so the
      # "Ignored build scripts" warning for sharp/@vercel/speed-insights/etc.
      # is expected.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `next build` needs no environment variables.
      - name: Build
        run: pnpm build
